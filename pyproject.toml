[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw-tasks-codecollection"
version = "0.1.0"
description = "rw-task: the generic runtime image custom capabilities compile onto (RunWhen platform)"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    # The capability SDK and its rwtask task host, pinned to a release tag.
    # pip's --require-hashes mode does not support VCS requirements at all,
    # so this is installed in its own, non-hash-checked `pip install` step
    # in Dockerfile.rw-task (see that file's comment), which pins the same
    # release -- keep the two in step.
    "runwhen-capability @ git+https://github.com/theyashl/runwhen-capability@0aac31522b0cb1aa4f193f494c109417d2070fe5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

# No importable package of its own -- this repo ships a capability
# directory, a Dockerfile and scripts, not a Python library. `pip install .`
# (the reusable image workflow's own install step) only needs `rwtask` on
# PATH, which the runwhen-capability dependency above already provides.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# rw-task declares no tasks and no output schemas of its own (see
# capabilities/rw-task/README.md) -- there is deliberately no
# [tool.rwtask.schemas] table here, and CI does not run `rwtask schemas
# --check` for the same reason.
