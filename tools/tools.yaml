# Declarative source of truth for every GitHub-release binary this image
# installs -- kubectl and yq, the two tools with no suitable apt package
# (Debian's own `yq` package is an unrelated Python/jq wrapper, not this
# `yq`).
#
# This file is HAND-EDITED; sbom/tools.cdx.json is GENERATED from it by
# scripts/gen_tool_sbom.py, which downloads each artifact and records its
# sha256. The Dockerfile installs from the SBOM, never from this file, so a
# version bump that has not been re-hashed cannot reach an image.
#
# Why an SBOM rather than a bespoke lock file: a statically linked binary
# copied into /usr/local/bin is INVISIBLE to every scanner that works off a
# package database (Trivy, Grype, osv-scanner all read dpkg/pip metadata).
# Without this file such a scan reports a clean image while two unmanaged
# binaries sit in it. CycloneDX with a PURL per component is what makes them
# visible to CVE matching.
#
# `purl` follows the package-url spec's `github` type; `binary` is the file
# name inside the archive (or the downloaded file itself, for `kind: binary`).

tools:
  - name: kubectl
    version: "1.37.1"
    purl: pkg:github/kubernetes/kubernetes@v1.37.1
    kind: binary
    binary: kubectl
    urls:
      amd64: https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
      arm64: https://dl.k8s.io/release/v1.37.1/bin/linux/arm64/kubectl

  - name: yq
    version: "4.53.6"
    purl: pkg:github/mikefarah/yq@v4.53.6
    kind: binary
    binary: yq
    urls:
      amd64: https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
      arm64: https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_arm64
